<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="JavaScript ES Modules activity for WDD 231.">
    <meta name="author" content="Romina De Santis Cruz">
    <title>JavaScript ES Modules</title>

    <link rel="stylesheet" href="Styls/modules.css">
    <script type="module" src="scripts/modules.mjs"></script>
</head>

<body>
    <main class="card">
        <h1>Web Frontend Development I</h1>
        <h2>WDD231</h2>

        <section class="controls">
            <div>
                <label for="sectionNumber">Choose a section:</label>
                <select id="sectionNumber"></select>
            </div>

            <button id="enrollStudent">Enroll a Student</button>
            <button id="dropStudent">Drop a Student</button>
        </section>

        <table>
            <thead>
                <tr>
                    <th>Section</th>
                    <th>Enrolled</th>
                    <th>Instructor</th>
                </tr>
            </thead>
            <tbody id="sections"></tbody>
        </table>
    </main>
</body>

</html>
